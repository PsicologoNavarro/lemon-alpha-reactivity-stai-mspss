name: repository-tests

on:
  push:
  pull_request:

jobs:
  static-and-numeric-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install analysis and test dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements/analysis-lock.txt
          python -m pip install --disable-pip-version-check pytest==8.3.4
      - name: Verify public repository boundary
        run: python scripts/verify_repository.py --repository .
      - name: Run synthetic and aggregate regression tests
        run: python -m pytest -q
